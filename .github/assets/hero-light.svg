<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">Bernardo Gomes — Developer</title>
  <desc id="desc">Desenvolvedor focado em web, Linux, automação e software para saúde.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="0.5" stop-color="#F3F1FD"/>
      <stop offset="1" stop-color="#ECFAFD"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#059669"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.4 0; 0.4 0; -0.4 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>

    <radialGradient id="auraA">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#0F172A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#312E81" flood-opacity="0.13"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="round"><rect width="1280" height="400" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <circle cx="120" cy="40" r="300" fill="url(#auraA)">
      <animate attributeName="r" values="300;340;300" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="370" r="300" fill="url(#auraB)">
      <animate attributeName="r" values="300;350;300" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- glass card -->
    <g transform="translate(72 56)" filter="url(#soft)">
      <rect width="1136" height="288" rx="26" fill="#FFFFFF" fill-opacity="0.82" stroke="#C7D2FE" stroke-opacity="0.9"/>
      <rect x="0" y="0" width="6" height="288" rx="3" fill="url(#accent)"/>
    </g>

    <!-- window dots -->
    <g transform="translate(1104 90)">
      <circle cx="0" cy="0" r="5.5" fill="#EF4444" fill-opacity="0.75"/>
      <circle cx="24" cy="0" r="5.5" fill="#F59E0B" fill-opacity="0.75"/>
      <circle cx="48" cy="0" r="5.5" fill="#10B981" fill-opacity="0.75"/>
    </g>

    <!-- copy -->
    <text x="122" y="132" fill="#6B7280" font-size="15" font-weight="700" letter-spacing="5.5">
      DEVELOPER · OPEN SOURCE · BRASIL
    </text>

    <text x="119" y="208" fill="url(#nameFill)" font-size="62" font-weight="800" letter-spacing="-2.4">
      Bernardo Gomes
    </text>

    <g transform="translate(122 248)">
      <text fill="#334155" font-size="21" font-weight="500">
        Construo produto de ponta a ponta<tspan fill="#94A3B8"> — </tspan><tspan fill="#6D28D9">web</tspan><tspan fill="#CBD5E1"> · </tspan><tspan fill="#0E7490">linux</tspan><tspan fill="#CBD5E1"> · </tspan><tspan fill="#047857">automação</tspan><tspan fill="#CBD5E1"> · </tspan><tspan fill="#BE123C">saúde</tspan>
      </text>
    </g>

    <!-- prompt line -->
    <g transform="translate(122 300)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text fill="#059669" font-weight="700">~</text>
      <text x="18" fill="#94A3B8">$</text>
      <text x="36" fill="#64748B">git commit -m "</text>
      <text x="184" fill="#0F172A" font-weight="600">ship small, ship often</text>
      <text x="382" fill="#64748B">"</text>
      <rect x="396" y="-13" width="9" height="18" fill="#0891B2">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- signal graph -->
    <g transform="translate(886 128)" filter="url(#glow)">
      <path d="M0 96 L44 96 L64 52 L96 150 L128 40 L156 104 L180 76 L246 76"
            fill="none" stroke="url(#accent)" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="620" stroke-dashoffset="620">
        <animate attributeName="stroke-dashoffset" from="620" to="0" dur="2.6s" fill="freeze"/>
      </path>
      <circle cx="0" cy="96" r="7" fill="#7C3AED">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze"/>
      </circle>
      <circle cx="246" cy="76" r="7" fill="#059669">
        <animate attributeName="opacity" values="0;0;1" dur="2.8s" fill="freeze"/>
        <animate attributeName="r" values="7;10;7" dur="2.4s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- bottom chips -->
    <g transform="translate(72 366)" font-size="13" font-weight="600" letter-spacing="1.6">
      <g fill="#64748B">
        <text x="50">REACT</text>
        <text x="140">TYPESCRIPT</text>
        <text x="288">PYTHON</text>
        <text x="390">RUST</text>
        <text x="460">QML</text>
        <text x="520">TAURI</text>
        <text x="596">FASTAPI</text>
        <text x="692">ARCH LINUX</text>
      </g>
      <g fill="#CBD5E1">
        <text x="126">·</text><text x="274">·</text><text x="376">·</text>
        <text x="446">·</text><text x="506">·</text><text x="582">·</text><text x="678">·</text>
      </g>
    </g>
  </g>
</svg>
